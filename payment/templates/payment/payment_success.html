{% extends 'base.html' %}

{% block title %}پرداخت موفق{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; border: 1px solid #d4edda; border-radius: 8px; background-color: #d4edda; color: #155724;">
    <h2>🎉 پرداخت با موفقیت انجام شد</h2>
    <p>شماره سفارش: <strong>{{ order.order_number }}</strong></p>
    <p>کد پیگیری تراکنش (RefID): <strong>{{ ref_id }}</strong></p>
    <p>مبلغ پرداخت‌شده: <strong>{{ order.total_price }} تومان</strong></p>
    
    <div style="margin-top: 20px;">
        <a href="{% url 'shop:product_list' %}" style="padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">بازگشت به فروشگاه</a>
    </div>
</div>
{% endblock %}
