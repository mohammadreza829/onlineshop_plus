{% extends 'base.html' %}

{% block title %}پرداخت ناموفق{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; border: 1px solid #f8d7da; border-radius: 8px; background-color: #f8d7da; color: #721c24;">
    <h2>❌ پرداخت انجام نشد</h2>
    {% if order %}
        <p>شماره سفارش: <strong>{{ order.order_number }}</strong></p>
    {% endif %}
    <p>{{ error }}</p>

    <div style="margin-top: 20px;">
        {% if order and order.is_payable %}
            <form method="post" action="{% url 'payment:process' order.id %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; margin-left: 10px; cursor: pointer;">تلاش مجدد برای پرداخت</button>
            </form>
        {% endif %}
        <a href="{% url 'shop:product_list' %}" style="padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px;">بازگشت به فروشگاه</a>
    </div>
</div>
{% endblock %}
