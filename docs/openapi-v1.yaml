openapi: 3.0.3
info:
  title: Online Shop API
  version: 1.0.0
  description: Versioned catalog, OTP/JWT, addresses, session cart, orders and payment
    initiation. All prices are Toman.
paths:
  /api/schema/:
    get:
      operationId: api_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/addresses/:
    get:
      operationId: api_v1_addresses_list
      parameters:
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: api_v1_addresses_create
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Address'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Address'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/addresses/{id}/:
    get:
      operationId: api_v1_addresses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: api_v1_addresses_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddress'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: api_v1_addresses_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshInput'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/otp/request/:
    post:
      operationId: api_v1_auth_otp_request_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Phone'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Phone'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Phone'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: api_v1_auth_otp_verify_create
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/cart/:
    get:
      operationId: api_v1_cart_retrieve
      description: مشاهده محتویات سبد خرید جاری
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: api_v1_cart_create
      description: افزودن محصول به سبد خرید
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: api_v1_cart_destroy
      description: حذف یک محصول مشخص یا پاک‌سازی کل سبد خرید
      parameters:
      - in: query
        name: variant_id
        schema:
          type: integer
          minimum: 1
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/items/{product_id}/:
    patch:
      operationId: api_v1_cart_items_partial_update
      description: |-
        مدیریت سبد خرید (دریافت لیست، افزودن محصول، حذف محصول).
        سبد خرید در session نگه‌داری می‌شود، پس برای مهمان هم در دسترس است.
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartQuantity'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartQuantity'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartQuantity'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartQuantityResponse'
          description: ''
    delete:
      operationId: api_v1_cart_items_destroy
      description: حذف یک محصول مشخص یا پاک‌سازی کل سبد خرید
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      - in: query
        name: variant_id
        schema:
          type: integer
          minimum: 1
      tags:
      - Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/categories/:
    get:
      operationId: api_v1_categories_list
      parameters:
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: integer
          minimum: 1
      - in: query
        name: roots_only
        schema:
          type: boolean
          default: false
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
          minLength: 1
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/v1/categories/{slug}/:
    get:
      operationId: api_v1_categories_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/client-options/:
    get:
      operationId: api_v1_client_options_retrieve
      tags:
      - Client bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientOptions'
          description: ''
  /api/v1/csrf/:
    get:
      operationId: api_v1_csrf_retrieve
      tags:
      - Client bootstrap
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRF'
          description: ''
  /api/v1/favorites/:
    get:
      operationId: api_v1_favorites_list
      parameters:
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/me/:
    get:
      operationId: api_v1_me_retrieve
      tags:
      - Account
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    patch:
      operationId: api_v1_me_partial_update
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomer'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/notifications/:
    get:
      operationId: api_v1_notifications_list
      parameters:
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/read/:
    post:
      operationId: api_v1_notifications_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/orders/:
    get:
      operationId: api_v1_orders_list
      description: |-
        مشاهده لیست سفارش‌های کاربر جاری با امکان فیلتر بر اساس status
        مثال: /orders/api/v1/orders/?status=paid
      parameters:
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - pending
          - paid
          - preparing
          - sent
          - delivered
          - canceled
          - expired
          - needs_review
          type: string
          minLength: 1
        description: |-
          * `pending` - در انتظار پرداخت
          * `paid` - پرداخت شده
          * `preparing` - در حال آماده‌سازی
          * `sent` - ارسال شده
          * `delivered` - تحویل داده شده
          * `canceled` - لغو شده
          * `expired` - منقضی شده
          * `needs_review` - نیازمند بررسی
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderDetailList'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: api_v1_orders_retrieve
      description: مشاهده جزئیات یک سفارش مشخص
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: api_v1_orders_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/orders/{id}/payment/:
    post:
      operationId: api_v1_orders_payment_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
          description: ''
  /api/v1/orders/{id}/tracking/:
    get:
      operationId: api_v1_orders_tracking_list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/v1/orders/create/:
    post:
      operationId: api_v1_orders_create_create
      description: ثبت سفارش جدید بر اساس سبد خرید فعلی و آدرس انتخاب‌شده
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
          description: ''
  /api/v1/products/:
    get:
      operationId: api_v1_products_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          maxLength: 250
          pattern: ^[-a-zA-Z0-9_]+$
          minLength: 1
      - name: limit
        required: false
        in: query
        description: تعداد نتایج برای نمایش در هر صفحه.
        schema:
          type: integer
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      - name: offset
        required: false
        in: query
        description: ایندکس اولیه‌ای که از آن نتایج بازگردانده می‌شود.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          enum:
          - price
          - -price
          - created
          - -created
          - name
          - -name
          - relevance
          type: string
          default: -created
          minLength: 1
        description: |-
          * `price` - price
          * `-price` - -price
          * `created` - created
          * `-created` - -created
          * `name` - name
          * `-name` - -name
          * `relevance` - relevance
      - in: query
        name: search
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: stock
        schema:
          enum:
          - available
          - out
          type: string
          minLength: 1
        description: |-
          * `available` - available
          * `out` - out
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/products/{id}/favorite/:
    put:
      operationId: api_v1_products_favorite_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Favorites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: api_v1_products_favorite_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Favorites
      security:
      - jwtAuth: []
