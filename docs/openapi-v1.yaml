components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: عنوان آدرس (مثلاً خانه، محل کار)
          maxLength: 100
        receiver_name:
          type: string
          title: نام تحویل‌گیرنده
          maxLength: 100
        receiver_phone:
          type: string
          title: شماره تماس تحویل‌گیرنده
          maxLength: 20
        province:
          allOf:
          - $ref: '#/components/schemas/ProvinceEnum'
          title: استان
        city:
          type: string
          title: شهر
          maxLength: 100
        full_address:
          type: string
          title: آدرس دقیق پستی
        postal_code:
          type: string
          title: کد پستی
          maxLength: 20
        is_default:
          type: boolean
          title: آدرس پیش‌فرض
      required:
      - city
      - full_address
      - id
      - postal_code
      - receiver_name
      - receiver_phone
      - title
    CSRF:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        post_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        item_count:
          type: integer
        is_empty:
          type: boolean
      required:
      - discount
      - is_empty
      - item_count
      - items
      - post_price
      - subtotal
      - total_price
    CartItem:
      type: object
      properties:
        variant_id:
          type: integer
          nullable: true
        product_id:
          type: integer
        name:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
        quantity:
          type: integer
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
      required:
      - name
      - price
      - product_id
      - quantity
      - total_price
      - variant_id
    CartItemAdd:
      type: object
      description: سریالایزر افزودن محصول به سبد خرید
      properties:
        variant_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 100
          minimum: 1
          default: 1
      required:
      - product_id
    CartQuantityResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        post_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,0})?$
        item_count:
          type: integer
        is_empty:
          type: boolean
        quantity_clamped:
          type: boolean
      required:
      - discount
      - is_empty
      - item_count
      - items
      - post_price
      - quantity_clamped
      - subtotal
      - total_price
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
          title: دسته بندی محصولات
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          readOnly: true
          nullable: true
          title: دسته والد
      required:
      - id
      - name
      - parent
      - slug
    CheckoutResponse:
      type: object
      properties:
        message:
          type: string
        payment_url:
          type: string
          format: uri
        payment_api_url:
          type: string
          format: uri
        reserved_until:
          type: string
          format: date-time
        order:
          $ref: '#/components/schemas/OrderDetail'
      required:
      - message
      - order
      - payment_api_url
      - payment_url
      - reserved_until
    ClientOptions:
      type: object
      properties:
        currency:
          type: string
        time_zone:
          type: string
        cart_quantity_max:
          type: integer
        cart_lines_max:
          type: integer
        pagination_default:
          type: integer
        pagination_max:
          type: integer
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/ProvinceOption'
      required:
      - cart_lines_max
      - cart_quantity_max
      - currency
      - pagination_default
      - pagination_max
      - provinces
      - time_zone
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 25
        last_name:
          type: string
          maxLength: 25
      required:
      - first_name
      - id
      - last_name
      - phone
    Dashboard:
      type: object
      properties:
        from_date:
          type: string
          format: date
        to_date:
          type: string
          format: date
        time_zone:
          type: string
        currency:
          type: string
        orders_created:
          type: integer
        created_orders_by_status:
          type: array
          items:
            $ref: '#/components/schemas/StatusCount'
        paid_orders_count:
          type: integer
        paid_orders_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        canceled_paid_orders_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        successful_payment_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        duplicate_payment_refund_flag_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        needs_review_orders_all_time:
          type: integer
        coupon_over_capacity_all_time:
          type: integer
        unknown_payments_all_time:
          type: integer
      required:
      - canceled_paid_orders_value
      - coupon_over_capacity_all_time
      - created_orders_by_status
      - currency
      - duplicate_payment_refund_flag_amount
      - from_date
      - needs_review_orders_all_time
      - orders_created
      - paid_orders_count
      - paid_orders_value
      - successful_payment_amount
      - time_zone
      - to_date
      - unknown_payments_all_time
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sequence:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        previous_status:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        carrier:
          type: string
          readOnly: true
        tracking_code:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - carrier
      - created
      - id
      - kind
      - previous_status
      - sequence
      - status
      - tracking_code
    Feature:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: مشخصات
          maxLength: 250
        value:
          type: string
          title: مقدار ویژگی
          maxLength: 250
      required:
      - id
      - name
      - value
    KindEnum:
      enum:
      - created
      - status
      - tracking
      - payment
      type: string
      description: |-
        * `created` - ایجاد
        * `status` - وضعیت
        * `tracking` - اطلاعات ارسال
        * `payment` - تایید پرداخت
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    MyReview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rating:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        updated:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/MyReviewStatusEnum'
