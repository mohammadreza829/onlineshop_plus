        last_name:
          type: string
          readOnly: true
          title: نام خانوادگی
        phone:
          type: string
          readOnly: true
          title: شماره تماس
        address:
          type: string
          readOnly: true
          title: آدرس
        postal_code:
          type: string
          readOnly: true
          title: کد پستی
        post_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
          title: هزینه ارسال
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
