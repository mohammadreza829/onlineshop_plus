


{% block title %}
پرداخت ناموفق
{% endblock %}


{% block content %}


<div class="container mt-5">


    <div class="alert alert-danger">


        <h3>
            پرداخت ناموفق بود
        </h3>


        <p>
            پرداخت سفارش شما تایید نشد.
        </p>


        <p>
            سفارش شماره:

            <strong>
                {{ order.order_number }}
            </strong>

        </p>


    </div>


    <a href="{% url 'orders:order_detail' order.id %}"
       class="btn btn-warning">

        بازگشت به سفارش

    </a>


</div>


{% endblock %}
